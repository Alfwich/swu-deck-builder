name: Build Electron release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: electron-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:RELEASE_TAG' must be a semantic version such as v1.2.3."
          }
          npm version $version --no-git-tag-version --ignore-scripts --allow-same-version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build Electron distributables
        run: npm run desktop:make

      - name: Upload desktop assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $assetDirectory = 'out\make\squirrel.windows\x64'
          $assets = Get-ChildItem -LiteralPath $assetDirectory -File |
            Where-Object { $_.Name -eq 'RELEASES' -or $_.Extension -in '.exe', '.nupkg' } |
            Select-Object -ExpandProperty FullName
          if (-not $assets) {
            throw "No Electron release assets were created in $assetDirectory."
          }
          gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
