name: Build Electron release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: electron-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Build ${{ matrix.name }} desktop app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: macOS Universal
            os: macos-latest
            platform: macos
            arch: universal
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:RELEASE_TAG' must be a semantic version such as v1.2.3."
          }
          npm version $version --no-git-tag-version --ignore-scripts --allow-same-version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build Electron distributables
        run: npm run desktop:make -- --arch=${{ matrix.arch }}

      - name: Upload desktop assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $extensions = switch ($env:RELEASE_PLATFORM) {
            'windows' { '.exe'; '.nupkg' }
            'macos' { '.dmg'; '.zip' }
            'linux' { '.deb'; '.rpm' }
            default { throw "Unsupported release platform '$env:RELEASE_PLATFORM'." }
          }
          $assets = @(Get-ChildItem -LiteralPath 'out\make' -Recurse -File |
            Where-Object {
              $extensions -contains $_.Extension.ToLowerInvariant() -or
                ($env:RELEASE_PLATFORM -eq 'windows' -and $_.Name -eq 'RELEASES')
            } |
            Select-Object -ExpandProperty FullName)
          if (-not $assets) {
            throw "No $env:RELEASE_PLATFORM Electron release assets were created."
          }
          gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
