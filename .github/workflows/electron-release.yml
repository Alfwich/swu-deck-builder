name: Build Electron release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semantic-version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: electron-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify package version matches release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:RELEASE_TAG' must be a semantic version such as v1.2.3."
          }
          $package = Get-Content -LiteralPath package.json -Raw |
            ConvertFrom-Json -AsHashtable
          $lock = Get-Content -LiteralPath package-lock.json -Raw |
            ConvertFrom-Json -AsHashtable
          $versions = [ordered]@{
            'package.json' = [string]$package['version']
            'package-lock.json' = [string]$lock['version']
            'package-lock.json root package' =
              [string]$lock['packages']['']['version']
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $version) {
              throw "$($entry.Key) version '$($entry.Value)' does not match release tag '$env:RELEASE_TAG'."
            }
          }
          $notesPath = "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are missing: $notesPath"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release metadata is aligned at version $version."

  desktop:
    name: Build ${{ matrix.name }} desktop app
    needs: validate-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: macOS Universal
            os: macos-latest
            platform: macos
            arch: universal
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build Electron distributables
        run: npm run desktop:make -- --arch=${{ matrix.arch }}

      - name: Stage desktop assets
        shell: pwsh
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          $extensions = switch ($env:RELEASE_PLATFORM) {
            'windows' { '.exe'; '.nupkg' }
            'macos' { '.dmg'; '.zip' }
            'linux' { '.deb'; '.rpm' }
            default { throw "Unsupported release platform '$env:RELEASE_PLATFORM'." }
          }
          $assets = @(Get-ChildItem -LiteralPath 'out\make' -Recurse -File |
            Where-Object {
              $extensions -contains $_.Extension.ToLowerInvariant() -or
                ($env:RELEASE_PLATFORM -eq 'windows' -and $_.Name -eq 'RELEASES')
            } |
            Select-Object -ExpandProperty FullName)
          if (-not $assets) {
            throw "No $env:RELEASE_PLATFORM Electron release assets were created."
          }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath $assets -Destination release-assets

      - name: Preserve desktop assets for publication
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [validate-release, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Collect desktop assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          existing_state=$(gh release view "$RELEASE_TAG" \
            --json isDraft \
            --jq '.isDraft' \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)
          if [[ "$existing_state" == "false" ]]; then
            echo "$RELEASE_TAG is already published; leaving it unchanged."
            exit 0
          fi
          if [[ "$existing_state" == "true" ]]; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft \
              --notes-file "docs/releases/$RELEASE_VERSION.md" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SWU Deck Builder $RELEASE_VERSION" \
              --verify-tag \
              "${prerelease[@]}"
          fi
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --notes-file "docs/releases/$RELEASE_VERSION.md" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SWU Deck Builder $RELEASE_VERSION" \
            "${prerelease[@]}"

      - name: Retain assets on only the newest three published releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_ids=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq 'add | map(select(.draft == false)) | sort_by(.published_at) | reverse | .[3:] | .[].id')
          while read -r release_id; do
            [[ -n "$release_id" ]] || continue
            asset_ids=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[].id')
            while read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done <<< "$asset_ids"
          done <<< "$release_ids"
